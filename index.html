<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenida</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fdf1ea;
      color: #444444;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      color: #d4566a;
    }

    .caja {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      background-color: #ffffff;
      border: 2px solid #e9a97f;
      border-radius: 8px;
    }

    #bienvenida {
      font-size: 22px;
      font-weight: bold;
    }

    #dias {
      font-size: 18px;
    }

    button {
      padding: 8px 16px;
      background-color: #ee7b85;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="caja">
    <!-- El mensaje de bienvenida se muestra siempre y JavaScript lo personaliza -->
    <p id="bienvenida">¡Bienvenido/a!</p>
    <p id="dias"></p>
  </div>

  <button id="reiniciar">Ingresar otros datos</button>

  <script>
    // EJERCICIO 1: tres variables con datos personales
    // (versión original, antes de pedirle los datos al usuario)
    // var nombre = "Juliana";
    // var apellido = "Perez";
    // var fechaNacimiento = "15/03/1998";

    function iniciar() {
      // EJERCICIO 2: el usuario ingresa sus datos
      var nombre = prompt("Ingrese su nombre:");
      var apellido = prompt("Ingrese su apellido:");
      var fechaNacimiento = prompt("Ingrese su fecha de nacimiento (dd/mm/aaaa):");

      var bienvenida = document.querySelector("#bienvenida");
      var dias = document.querySelector("#dias");

      // Si el usuario cancela o deja algo vacío, queda el mensaje general
      if (!nombre || !apellido || !fechaNacimiento) {
        bienvenida.textContent = "¡Bienvenido/a!";
        dias.textContent = "";
        return;
      }

      // EJERCICIO 1: mensaje de bienvenida
      bienvenida.textContent = "¡Bienvenido/a " + nombre + "!";

      // EJERCICIO 3: días vividos desde que nació
      var partes = fechaNacimiento.split("/");
      var dia = Number(partes[0]);
      var mes = Number(partes[1]);
      var anio = Number(partes[2]);

      var nacimiento = new Date(anio, mes - 1, dia);
      var hoy = new Date();
      var msPorDia = 1000 * 60 * 60 * 24;
      var diasVividos = Math.floor((hoy - nacimiento) / msPorDia);

      if (isNaN(diasVividos)) {
        dias.textContent = "No pudimos calcular los días, revisá el formato de la fecha (dd/mm/aaaa).";
      } else {
        dias.textContent = "Desde que naciste viviste " + diasVividos + " días.";
      }
    }

    // Se ejecuta cuando carga la página
    window.addEventListener("load", iniciar);

    // Botón para volver a ingresar los datos
    document.querySelector("#reiniciar").addEventListener("click", iniciar);
  </script>
</body>
</html>
